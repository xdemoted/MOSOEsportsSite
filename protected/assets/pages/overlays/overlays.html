<div></div>
<a class="overlay" href="/dashboard/overlays/new">Create Overlay</a>
<script type="module">
    import {Table} from "/protected/modules/table/table.js"

    const module = document.querySelector(".module")

    if (module) {
        const table = new Table(module.querySelector("div:last-of-type"),"#373737")

        table.addColumn("Overlay Name",1.5)
        table.addColumn("Created By")
        table.addColumn("Date Created")
        table.addButton("/images/icons/misc/link.svg")
        table.addButton("/images/icons/misc/pen.svg")
        table.addButton("/images/icons/misc/trash.svg","#00000000","#aa3333")

        fetchData(table)

        table.updateView()
    }

    async function fetchData(table) {
        const response = await fetch("/api/overlays")

        if (!response.ok) return // TODO - Error Handling

        const data = await response.json()

        data.forEach(overlay => {
            table.addRow([
                overlay.overlaytype,
                overlay.createdBy,
                overlay.createdAt,
                `/api/overlays/${overlay.recordID}`,
                `/dashboard/overlays/${overlay.recordID}`
            ])
        });
    }
</script>
<style>
    .overlay {
        border-radius: 10px;
        width: 150px;
        height: 36px;
        margin-top: 16px;
        padding: 8px 12px;
        border: 2px solid #007a39;
        margin-left: auto;
        background-color: #006931;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 100;
        font-size: 14px;
    }

    @media only screen and (max-width: 500px) {
        .overlay {
            width: 100%;
            height: 49px;
        }
    }
</style>
