<footer class="site-footer">
    <style>
        @font-face {
            font-family: "BatmanForever";
            src: url("fonts/batmfa_.ttf") format("truetype")
        }

        @font-face {
            font-family: "Avenir";
            src: url("fonts/avenir.woff") format("woff")
        }

        #footer {
            width: 100%;
            height: 500px;
            background-color: #333;
            justify-content: flex-end;
            flex-direction: column;
            display: flex;
            flex-shrink: 0;
        }

        #footercontent {
            height: 400px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            flex-shrink: 0;
        }

        #about {
            width: 30vw;
            height: 300px;
        }

        #about img {
            width: 75%;
        }

        #teams {
            width: 13vw;
            height: 300px;
            display: flex;
            flex-direction: column;
        }

        #quicklinks {
            width: 15vw;
            height: 300px;
            display: flex;
            flex-direction: column;
        }

        #resources {
            width: 15vw;
            height: 300px;
            display: flex;
            flex-direction: column;
        }

        #media {
            width: 27vw;
            height: 300px;
            display: flex;
            justify-content: center;
        }

        #media div {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 50%
        }

        #media div img {
            width: 50px;
            height: 50px;
            margin-right: 10px;
        }

        #footer h1 {
            color: #006931;
            font-size: 2em;
            font-family: "BatmanForever";
        }

        #footer a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.3em;
            font-family: "Avenir";
        }

        #footer li {
            padding-bottom: 5px;
        }
    </style>
    <div id="footer">
        <div id="footercontent">
            <div id="about">
                <img src="../logo/moso_banner.png">
            </div>
            <div id="teams">
                <ul>
                    <li>
                        <h1>Teams</h1>
                    </li>
                    <li><a href="#">Mario Kart 8 Deluxe</a></li>
                    <li><a href="#">Mario Kart World</a></li>
                    <li><a href="#">Marvel Rivals</a></li>
                    <li><a href="#">Overwatch</a></li>
                    <li><a href="#">Rainbow Six Siege</a></li>
                    <li><a href="#">Rocket League</a></li>
                    <li><a href="#">Super Smash Bros</a></li>
                </ul>
            </div>
            <div id="quicklinks">
                <ul>
                    <li>
                        <h1>Quick Links</h1>
                    </li>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Schedule</a></li>
                    <li><a href="#">Teams</a></li>
                </ul>
            </div>
            <div id="resources">
                <ul>
                    <li>
                        <h1>Resources</h1>
                    </li>
                    <li><a href="#">Contact us</a></li>
                </ul>
            </div>
            <div id="media">
                <div>
                    <img src="/images/icons/instagram.svg">
                    <img src="/images/icons/youtube.svg">
                    <img src="/images/icons/twitch.svg">
                </div>
            </div>
        </div>
    </div>
</footer>
