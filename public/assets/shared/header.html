<header class="site-header">
    <style>
        #navbar {
            list-style-type: none;
            display: flex;
            width: 100%;
            height: 75px;
            top: 0;
            left: 0;
            background-color: #333333;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
            justify-content: space-between;
        }

        #navbar div {
            display: flex;
        }

        #navbar div img {
            background-color: #003117;
            width: 170;
            padding-right: 20px;
            padding-left: 10px;
            clip-path: polygon(0 0, 100% 0, calc(100% - 20px) 100%, 0 100%);
        }

        #navbar div ul {
            list-style-type: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        #navbar div a {
            padding: 0 30px 0 30px;
            color: white;
            font-family: 'Arial';
            text-decoration: unset;
            margin-left: -20px;
            height: 100%;
            width: 150;
            justify-content: center;
            align-items: center;
            display: flex;
            clip-path: polygon(0 100%, 20px 0, 100% 0, calc(100% - 20px) 100%);
        }

        #navbar div a:hover {
            background-image: linear-gradient(rgb(0 0 0/40%) 0 0);
        }

        #navbar div .active {
            background-color: #006931;
        }

        #navbar .account {
            width: 200px;
            background-color: #5865F2;
            height: 100%;
            border: none;
            clip-path: polygon(20px 0, 100% 0, 100% 100%, 0 100%);

            padding: 0 30px 0 30px;
            color: white;
            font-size: 20px;
            font-family: 'Arial';
            text-decoration: unset;
            display: flex;
            align-items: center;
        }

        #navbar .account img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }

        #navbar button:hover {
            background-image: linear-gradient(rgb(0 0 0/40%) 0 0);
            cursor: pointer;
        }
    </style>
    <div class="logo"></div>
    <div id="navbar">
        <div>
            <img src="../logo/moso_banner.png">
            <a href="/"><b>Home</b></a>
            <a href="/schedule"><b>Schedule</b></a>
            <a href="/games"><b>Games</b></a>
        </div>
        <button class="account">
            <img src="https://cdn.prod.website-files.com/6257adef93867e50d84d30e2/66e3d7f4ef6498ac018f2c55_Symbol.svg">
            <p><b>Login</b></p>
        </button>
    </div>
</header>
