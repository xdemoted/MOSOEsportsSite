<header class="site-header">
    <style>
        @font-face {
            font-family: "Avenir";
            src: url("fonts/avenir.woff") format("woff")
        }

        #navbar {
            list-style-type: none;
            display: flex;
            width: 100%;
            height: 75px;
            top: 0;
            left: 0;
            background-color: #333333;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
            justify-content: space-between;
            font-family: "Avenir";
            font-size: max(16px, 1vw);
        }

        #navbar div {
            display: flex;
        }

        #navbar div .bannerwrap img {
            background-color: #003117;
            width: auto;
            padding-right: 20px;
            padding-left: 10px;
            clip-path: polygon(0 0, 100% 0, calc(100% - 20px) 100%, 0 100%);
        }

        #navbar div .bannerwrap {
            width: 210px;
            transition: width 0.5s ease-in-out;
        }

        #navbar div ul {
            list-style-type: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        #navbar div a {
            padding: 0 30px 0 30px;
            color: white;
            text-decoration: unset;
            margin-left: -21px;
            height: 100%;
            width: 100px;
            justify-content: center;
            align-items: center;
            display: flex;
            clip-path: polygon(0 100%, 20px 0, 100% 0, calc(100% - 20px) 100%);
            font-size: 1em;
            background-color: #333;
        }

        #navbar div a:hover {
            background-image: linear-gradient(rgb(0 0 0/40%) 0 0);
        }

        #navbar div .active {
            background-color: #006931;
        }

        #navbar .account {
            width: 175px;
            background-color: #5865F2;
            height: 100%;
            border: none;

            padding: 0 30px 0 30px;
            color: white;
            font-size: 1em;
            font-family: 'Arial';
            text-decoration: unset;
            display: flex;
            align-items: center;
        }

        #navbar .account img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }

        #navbar .setting {
            background-color: #333333;
            aspect-ratio: 1 / 1;
        }

        #navbar .setting img {
            width: 50px;
        }

        #navbar button:hover {
            background-image: linear-gradient(rgb(0 0 0/40%) 0 0);
            cursor: pointer;
        }
    </style>
    <div class="logo"></div>
    <div id="navbar">
        <div>
            <div class="bannerwrap"><img src="../logo/moso_banner.png"></div>
            <a href="/"><b>Home</b></a>
            <a href="/schedule"><b>Schedule</b></a>
            <a href="/teams"><b>Teams</b></a>
        </div>
        <div>
            <button class="setting">
                <img src="/images/icons/misc/setting.svg">
            </button>
            <button class="account">
                <img src="/images/icons/social/discord.svg">
                <p><b>Login</b></p>
            </button>
        </div>
    </div>
</header>
