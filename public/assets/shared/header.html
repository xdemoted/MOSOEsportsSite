<header class="site-header">
    <style>
        @font-face {
            font-family: "Avenir";
            src: url("fonts/avenir.woff") format("woff")
        }

        .navbar {
            list-style-type: none;
            display: flex;
            width: 100%;
            height: 75px;
            top: 0;
            left: 0;
            background-color: #333333;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
            justify-content: space-between;
            font-family: "Avenir", "Arial";
            font-size: max(16px, 1vw);
        }

        .navbar div {
            display: flex;
        }

        .navbar div .bannerwrap img {
            background-color: #003117;
            width: auto;
            padding-right: 20px;
            padding-left: 10px;
            clip-path: polygon(0 0, 100% 0, calc(100% - 20px) 100%, 0 100%);
        }

        .navbar div .bannerwrap {
            width: 210px;
            transition: width 0.5s ease-in-out;
        }

        .navbar div ul {
            list-style-type: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        .navbar div a {
            padding: 0 30px 0 30px;
            color: white;
            text-decoration: unset;
            margin-left: -21px;
            height: 100%;
            width: 100px;
            justify-content: center;
            align-items: center;
            display: flex;
            clip-path: polygon(0 100%, 20px 0, 100% 0, calc(100% - 20px) 100%);
            font-size: 1em;
            background-color: #333;
        }

        .navbar div a:hover {
            background-image: linear-gradient(rgb(0 0 0/40%) 0 0);
        }

        .navbar div .active {
            background-color: #006931;
        }

        .navbar .account {
            width: 175px;
            background-color: #5865F2;
            height: 100%;
            border: none;

            padding: 0 30px 0 30px;
            color: white;
            font-size: 1em;
            font-family: 'Arial';
            text-decoration: unset;
            display: flex;
            align-items: center;
        }

        .navbar .account img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
            border-radius: 50%;
        }

        .navbar .setting {
            background-color: #333333;
            aspect-ratio: 1 / 1;
        }

        .navbar .setting img {
            width: 50px;
        }

        button:hover {
            background-image: linear-gradient(rgb(0 0 0/40%) 0 0);
            cursor: pointer;
        }

        .subheader {
            position: sticky;
            padding-left: 3vw;
            padding-right: 3vw;
            padding-top: 5px;
            width: auto;
            display: flex;
            justify-content: space-between;
            background-color: #222;
            top: 0;
            font-family: 'Avenir', 'Arial';
        }

        .subheader div {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .subheader button {
            height: 35px;
            margin-bottom: 5px;
            margin-left: 2px;
            margin-right: 2px;
            background-color: #006931;
            border: none;
            color: white;
            border-radius: 5px;
            padding-left: 10px;
            padding-right: 10px;
        }

        .subheader div>div {
            height: 35px;
            margin-bottom: 5px;
            color: white;
            font-size: max(16px, 1vw);
        }
    </style>
    <div class="logo"></div>
    <div class="navbar">
        <div>
            <div class="bannerwrap"><img src="../logo/moso_banner.png"></div>
            <a href="/"><b>Home</b></a>
            <a href="/schedule"><b>Schedule</b></a>
            <a href="/teams"><b>Teams</b></a>
        </div>
        <div>
            <button class="setting">
                <img src="/images/icons/misc/setting.svg">
            </button>
            <button class="account">
                <img src="/images/icons/social/discord.svg">
                <p><b>Login</b></p>
            </button>
        </div>
    </div>
    <div class="subheader">
        <div class="left">
        </div>
        <div class="center"></div>
        <div class="right"></div>
    </div>
    <script>
        const headerScriptTag = document.scripts[document.scripts.length - 1];
        const headerElement = headerScriptTag.parentElement;

        const currentPath = window.location.pathname.replace(/\/+$/, '') || '/';
        headerElement.querySelectorAll('#navbar a').forEach(link => {
            const linkPath = new URL(link.href, window.location.href).pathname.replace(/\/+$/, '') || '/';
            link.classList.toggle('active', linkPath === currentPath);
        });

        const loginButton = headerElement.querySelector('.account');

        updateLogin();
        
        loginButton?.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/auth/getAccessToken');
                if (response.ok) {
                    updateLogin();
                    return;
                }
            } catch (error) {
                console.error('Error checking login status:', error);
            }

            try {
                const response = await fetch('/api/auth/redirect');
                if (!response.ok) {
                    throw new Error(`Login request failed: ${response.status}`);
                }

                const redirectUrl = await response.text();
                if (!redirectUrl) {
                    throw new Error('Login redirect URL was empty');
                }

                window.location.assign(redirectUrl);
            } catch (error) {
                console.error('Unable to start login:', error);
            }
        });

        function addSubHeaderButton(text, callback, align) {
            const button = document.createElement("button")
            button.innerText = text

            let aligndiv = headerElement.querySelector(`.subheader .${align}`)

            if (aligndiv) {
                aligndiv.appendChild(button)
                button.addEventListener('click', callback)
            } else {
            }
        }

        function setSubHeaderText(text, align) {
            const container = headerElement.querySelector(`.subheader .${align} .textcontainer`)

            if (container) {
                container.innerHTML = "<p><b>" + text + "</b></p>"
            } else {
                const aligndiv = headerElement.querySelector(`.subheader .${align}`)

                if (aligndiv) {
                    const newP = document.createElement("div")
                    newP.className = "textcontainer"
                    newP.innerHTML = "<p><b>" + text + "</b></p>"
                    aligndiv.appendChild(newP)
                }
            }
        }

        function updateLogin() {
            const user = fetch('/api/user/me').then(res => res.json()).then(data => {
                if (data && data.username) {
                    let avatarUrl = `/api/user/${data.id}/avatar`;
                    loginButton.innerHTML = `
                        <img src="${avatarUrl}" alt="Avatar">
                        <p><b>${data.displayname}</b></p>
                    `;

                    if (data.permissions & 2) {
                        addSubHeaderButton("Admin Dashboard", () => {
                            window.location.href = "/dashboard";
                        }, "left");
                    }
                }
            }).catch(err => {
                console.error('Error fetching user data:', err);
            });
        }
    </script>
</header>
